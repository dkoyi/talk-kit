<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Talk Kit — Keep the conversation open</title><style>
:root{--bg:#f7f5ef;--paper:#fffdf8;--ink:#233e38;--muted:#66736a;--line:#dfE3d9;--green:#265c4c;--orange:#edb586;--mint:#dfEbdc;--purple:#e9e1ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Trebuchet MS',Arial,sans-serif}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0}a{color:var(--green)}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #ba724e;outline-offset:4px}header{max-width:1280px;margin:auto;padding:27px 44px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{background:none;color:var(--ink);display:flex;align-items:center;gap:11px;font-size:22px;font-weight:bold;letter-spacing:-.8px}.brand-icon{display:grid;place-items:center;width:35px;height:35px;border-radius:11px 11px 11px 2px;background:var(--green);color:#f7ead6;font-size:23px}nav{display:flex;align-items:center;gap:24px}nav button{background:none;color:var(--muted);font-size:12px;font-weight:bold}.urgent{border:1px solid #d9aa8c!important;background:#fff8ef!important;color:#935b39!important;padding:9px 14px;border-radius:9px}main{max-width:1192px;margin:0 auto;padding:40px 0 60px}.eyebrow{font-size:10px;font-weight:bold;letter-spacing:1.8px;text-transform:uppercase;color:#778173}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:50px;align-items:center;padding:16px 0 34px}h1,h2,h3,p{margin-top:0}h1{font:normal 58px/1.08 Georgia,serif;letter-spacing:-2px;margin:19px 0 20px}h1 em{color:#57836b;font-weight:normal}h2{font:normal 30px/1.2 Georgia,serif;letter-spacing:-.6px}h3{font-size:18px;line-height:1.3}.hero p{color:var(--muted);max-width:455px;font-size:14px}.primary{background:var(--green);color:#fff;border-radius:10px;padding:12px 20px;font-size:12px;font-weight:bold}.primary:hover{background:#1b4438}.secondary{border:1px solid #cfd7ca;background:var(--paper);border-radius:10px;padding:11px 18px;font-size:12px;color:var(--ink);font-weight:bold}.hero-actions{display:flex;gap:12px;margin:25px 0 16px}.privacy{font-size:10px;color:var(--muted)}.hero-art{position:relative;background:#e4e9dc;border-radius:90px 24px 24px 24px;padding:20px;height:280px}.hero-art svg{width:100%;height:100%}.quote{position:absolute;bottom:18px;left:18px;right:18px;background:#fffdf7eF;border:1px solid #fff;border-radius:14px;padding:13px 17px;font:italic 17px Georgia,serif}.quote small{display:block;margin-top:7px;font:10px 'Trebuchet MS',sans-serif;color:var(--muted)}.trustline{display:flex;gap:35px;padding:17px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.trustline b{color:var(--green);margin-right:6px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:31px 0 19px}.section-head h2{margin:7px 0 0}.section-head p{font-size:12px;color:var(--muted);max-width:270px;margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid var(--line);background:var(--paper);border-radius:17px;overflow:hidden}.portrait{height:150px;position:relative;display:grid;place-items:center;overflow:hidden}.portrait svg{width:160px;height:150px}.portrait .topic{position:absolute;top:13px;left:14px;background:#fffdf7cE;border-radius:6px;padding:4px 8px;font-size:9px;color:#4d6354}.card-content{padding:20px}.card-content h3{margin-bottom:9px}.card-content p{font-size:12px;color:var(--muted);min-height:42px}.card-content blockquote{font:italic 16px/1.4 Georgia,serif;margin:0 0 17px}.card-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:15px}.card-bottom span{font-size:10px;color:var(--muted)}.card-bottom button{color:var(--green);font-weight:bold;background:none;font-size:12px}.how{margin-top:30px;background:#ecefe5;border-radius:17px;padding:23px 25px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:23px}.how strong{font-size:12px}.how p{font-size:11px;color:var(--muted);margin:6px 0 0}.num{display:inline-grid;place-items:center;border:1px solid #cdd8c6;width:24px;height:24px;border-radius:50%;margin-right:7px}footer{max-width:1192px;margin:auto;border-top:1px solid var(--line);padding:22px 0 30px;display:flex;justify-content:space-between;gap:20px;font-size:10px;color:var(--muted)}.steps{display:flex;gap:30px;margin:8px 0 27px;font-size:11px;color:var(--muted)}.steps .active{color:var(--green);font-weight:bold}.back{background:none;color:var(--muted);padding:0;margin-bottom:16px;font-size:12px}.prep-layout{display:grid;grid-template-columns:.8fr 1.2fr;gap:27px}.panel{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:27px}.scenario-intro .portrait{border-radius:13px;height:210px;margin-bottom:22px}.scenario-intro .portrait svg{height:210px;width:225px}.scenario-intro blockquote{font:italic 24px/1.4 Georgia,serif;margin:15px 0}.muted{color:var(--muted);font-size:13px}.tips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.tip{border-radius:12px;padding:16px;background:var(--mint);font-size:12px}.tip.avoid{background:#f3e8df}.tip strong{display:block;margin-bottom:7px}.tip p{margin:0}.breath{background:#eeE8f3;border-radius:13px;padding:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:12px}.breath button{background:#fff;border-radius:8px;padding:7px 13px;color:var(--ink);font-size:11px}.practice{display:grid;grid-template-columns:285px minmax(0,1fr) 270px;gap:20px}.practice .panel{padding:20px}.practice .portrait{border-radius:12px;height:145px}.practice h3{font-size:15px}.zone{display:block;font-size:11px;font-weight:bold;margin:12px 0}.meter{height:9px;border-radius:10px;background:linear-gradient(90deg,#dfb397 25%,#e8cf9b 25%,#e8cf9b 50%,#aec7a8 50%,#aec7a8 75%,#5c9178 75%);position:relative;margin:13px 0}.marker{position:absolute;top:-4px;height:17px;width:4px;background:var(--ink);border:1px solid #fff;transition:left .3s}.zones{display:flex;justify-content:space-between;font-size:8px;color:var(--muted)}.feeling{margin-top:25px;background:#f0ecef;border-radius:12px;padding:14px;font-size:12px}.feeling strong{display:block;font-size:10px;margin-bottom:6px}.sim-label{font-size:10px;color:var(--muted);margin-top:15px;line-height:1.5}.chatlog{min-height:190px;max-height:360px;overflow:auto;padding:6px 0 14px}.bubble{font-size:13px;border-radius:13px 13px 13px 3px;padding:13px 15px;background:#edf0e7;margin-bottom:12px;max-width:90%}.bubble.parent{background:#e3ecE5;border-radius:13px 13px 3px 13px;margin-left:auto}.speaker{font-size:9px;font-weight:bold;display:block;margin-bottom:5px;color:var(--muted)}.replies{display:grid;gap:9px}.reply{border:1px solid #d8ddd2;background:var(--paper);border-radius:10px;padding:11px 13px;text-align:left;color:var(--ink);font-size:12px}.reply:hover{background:#eef2e8;border-color:#6b927e}.formlabel{font-size:11px;color:var(--muted);display:block;margin:17px 0 7px}textarea{border:1px solid #ccd6c8;border-radius:10px;width:100%;padding:12px;resize:vertical;min-height:76px;background:#fff;color:var(--ink);font-size:12px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.actions button{font-size:11px}.coach-icon{width:35px;height:35px;background:var(--mint);border-radius:50%;display:grid;place-items:center;margin-bottom:12px}.coach p{font-size:12px;color:var(--muted)}.feedback{background:#eef2e8;border-radius:12px;padding:14px;font-size:12px;margin:15px 0}.feedback strong{display:block;margin-bottom:6px}.repair{width:100%;background:#f4e9dc;border:1px solid #dec3a6;border-radius:10px;padding:10px;font-weight:bold;color:#825b36;font-size:11px;margin-top:10px}.tag{display:inline-block;background:var(--mint);border-radius:20px;padding:4px 9px;font-size:9px;margin:2px}.summary{display:grid;grid-template-columns:1.3fr 1fr;gap:23px}.chart{width:100%;height:160px;background:#f2f4eb;border-radius:14px;margin:20px 0}.turn{padding:14px 0;border-top:1px solid var(--line);font-size:12px}.turn p{margin:5px 0;color:var(--muted)}.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:14px 0}.check input{accent-color:var(--green);margin-top:6px}.resource{display:block;text-decoration:none;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--paper);margin:12px 0}.resource strong{display:block;font-size:14px}.resource span{font-size:12px;color:var(--muted)}.script{font:italic 25px/1.5 Georgia,serif;color:var(--green);border-left:3px solid #a4ba98;padding-left:22px;margin:25px 0}.notice{background:#f1e7dc;border-radius:12px;padding:14px;font-size:12px}.focus-destination:focus{outline:none}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--green);color:white;border-radius:10px;padding:13px 22px;font-size:12px;z-index:5}[hidden]{display:none!important}@media(max-width:1230px){main,footer{margin-left:30px;margin-right:30px}.practice{grid-template-columns:230px 1fr}.coach{grid-column:1/-1}.coach .feedback{max-width:650px}.hero h1{font-size:49px}}@media(max-width:720px){header{padding:18px 20px}.brand{font-size:19px}nav{gap:12px}nav button{font-size:10px}nav .aboutnav{display:none}main{margin:0;padding:25px 20px 35px}.hero{grid-template-columns:1fr;gap:25px;padding-top:0}h1{font-size:43px!important}.hero-art{height:235px}.cards,.prep-layout,.practice,.summary{grid-template-columns:1fr}.how{grid-template-columns:1fr 1fr}.trustline{gap:12px;flex-wrap:wrap}.section-head{display:block}.section-head p{margin-top:10px}.tips{grid-template-columns:1fr}.steps{gap:17px;font-size:10px}.practice .portrait{height:110px}.practice .portrait svg{height:110px}.coach{grid-column:auto}footer{margin:0 20px;display:block}.panel{padding:20px}.hero-actions{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><button class="brand" id="home"><span class="brand-icon">◡</span>The Talk Kit<span style="color:#ad7c5c">.</span></button><nav><button id="how-nav">How it works</button><button class="aboutnav" id="about-nav">Our approach</button><button class="urgent" id="now-nav">It’s happening now ↗</button></nav></header><main id="app"></main><footer><span>Designed for parents & caregivers. Built around empathy, respect, and self-reflection.</span><span>Educational prototype · Fictional scenarios · Not therapy or emergency support</span></footer><div class="toast" id="toast" role="status" hidden></div><script>
const childArt=(i)=>`<svg viewBox="0 0 230 205" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="115" cy="100" r="83" fill="#fff" opacity=".35"/><path d="M55 203v-30c0-39 120-39 120 0v30" fill="${['#75896e','#c29a72','#9b8ea5'][i]}"/><rect x="101" y="132" width="28" height="29" rx="10" fill="${['#b47b57','#7a4e36','#d2a27f'][i]}"/><path d="M66 99V75c0-66 100-66 100 0v39" fill="${['#453b32','#303d39','#615043'][i]}"/><ellipse cx="115" cy="97" rx="44" ry="51" fill="${['#c58d67','#956547','#e1b492'][i]}"/><path d="M70 77c-1-57 91-63 96 0-27-8-36-27-39-34-11 20-34 32-57 34" fill="${['#453b32','#303d39','#615043'][i]}"/><path d="M87 89l11-2m34 0 11 2" stroke="#57463b" stroke-width="3" stroke-linecap="round"/><ellipse cx="94" cy="99" rx="3" ry="4" fill="#263a34"/><ellipse cx="137" cy="99" rx="3" ry="4" fill="#263a34"/><path d="M111 112l-2 5h7m-10 12q9-4 18 0" stroke="#775445" stroke-width="2" fill="none" stroke-linecap="round"/>${i===2?'<path d="M72 68q-31 8-22 44m106-44q31 8 24 44" fill="none" stroke="#615043" stroke-width="17"/>':''}</svg>`;
const scenarios=[{name:'Maya',age:13,color:'#e5e9dc',topic:'Unwanted contact',headline:'Someone online is asking for photos.',context:'A person Maya met in a game server is asking for personal photos and wants her to keep their conversations secret.',open:'Can I tell you something? Someone in my game keeps asking for pictures. Please don’t get mad.',later:['They said it was our secret. I didn’t know what to do.','I was worried you’d take my phone away. Can you help me?','Can we figure out what to do together?'],need:'Reassurance that telling you was a good decision, without blame.',feeling:'Maya might be worried that asking for help will get her into trouble.'},{name:'Jayden',age:11,color:'#eadfce',topic:'Cyberbullying',headline:'The group chat doesn’t feel safe anymore.',context:'Classmates are posting hurtful comments about Jayden in a group chat. He still wants to stay connected with his friends.',open:'Everyone in the class chat is making fun of me. I don’t want you to make it a big thing.',later:['They keep sharing it. Even when I’m at home, it’s still there.','I don’t want to lose my friends too. Can you listen first?','Can we choose someone at school to talk to together?'],need:'To feel heard and included in deciding what support comes next.',feeling:'Jayden might fear that adult intervention will make the situation worse.'},{name:'Lucía',age:8,color:'#e9e2ed',topic:'Upsetting content',headline:'A video scared her. Now she can’t sleep.',context:'Autoplay led Lucía to a violent video. She is distressed and worried she did something wrong.',open:'A scary video came on. I can’t stop thinking about it. Did I do something bad?',later:['I didn’t look for it. It just started playing.','I feel scared when I close my eyes. Can you stay with me?','Can we do something calming together?'],need:'Comfort, simple reassurance, and a calm adult who takes her feelings seriously.',feeling:'Lucía might be afraid you will blame her for something she did not seek out.'}];
let stage='home',selected=0,score=50,turns=[],messages=[],count=0,repairMode=false,customDraft='',breathTimer;const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function c(){return scenarios[selected]}function step(n){return `<div class="steps">${['Choose a situation','Prepare','Practice','Reflect'].map((v,i)=>`<span class="${i===n?'active':''}">${i+1}. ${v}</span>`).join('')}</div>`}function focusTitle(){const h=$('main h1');if(h){h.tabIndex=-1;h.classList.add('focus-destination');h.focus()}}function go(s){if(breathTimer){clearInterval(breathTimer);breathTimer=null}stage=s;render();window.scrollTo(0,0);focusTitle()}function reset(){score=50;turns=[];messages=[{who:c().name,text:c().open}];count=0;repairMode=false;customDraft=''}function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}
function home(){return `<section class="hero"><div><div class="eyebrow">A little practice. A more open conversation.</div><h1>When they tell you,<br><em>be ready to listen.</em></h1><p>Practice the moment your child shares something difficult that happened online. Find your words, understand their perspective, and learn how to begin again.</p><div class="hero-actions"><button class="primary" id="start">Find a situation →</button><button class="secondary" id="how-button">How practice works</button></div><div class="privacy">◎ No account needed · Practice responses stay in this browser session</div></div><div class="hero-art"><svg viewBox="0 0 450 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="235" cy="90" r="87" fill="#c9d7bf"/><path d="M100 200v-48c0-52 100-52 100 0v48" fill="#567964"/><ellipse cx="151" cy="97" rx="32" ry="40" fill="#c99571"/><path d="M116 92V60c18-38 74-19 68 27-17-1-39-7-49-20-2 12-8 20-19 25" fill="#49443c"/><path d="M253 200v-27c0-42 100-42 100 0v27" fill="#c29e7e"/><ellipse cx="301" cy="129" rx="27" ry="33" fill="#d7a886"/><path d="M272 126v-31c22-27 61-11 57 26-24-5-34-19-34-19-4 11-11 19-23 24" fill="#5e4d3f"/><path d="M179 165q40 25 90 7" stroke="#c99571" stroke-width="16" fill="none" stroke-linecap="round"/><rect x="210" y="36" width="116" height="49" rx="15" fill="#fffaf0"/><path d="M221 83l-7 16 26-16" fill="#fffaf0"/><path d="M231 60h69m-69 10h45" stroke="#94a588" stroke-width="4" stroke-linecap="round"/><path d="M360 45v16m-8-8h16" stroke="#ae8c62" stroke-width="3"/></svg><div class="quote">“Thank you for telling me. I’m here with you.”<small>A first response that leaves room for more.</small></div></div></section><div class="trustline"><span><b>✧</b> Guided, fictional scenarios</span><span><b>◎</b> No child accounts or chat uploads</span><span><b>↺</b> Space to practice and repair</span></div><section id="situations"><div class="section-head"><div><div class="eyebrow">Start where you are</div><h2>Choose a conversation to practice.</h2></div><p>Three situations. A few minutes.<br>No perfect-parent score.</p></div><div class="cards">${scenarios.map((s,i)=>`<article class="card"><div class="portrait" style="background:${s.color}"><span class="topic">${s.topic}</span>${childArt(i)}</div><div class="card-content"><h3>${s.name}, ${s.age}</h3><p>${s.headline}</p><blockquote>“${s.open}”</blockquote><div class="card-bottom"><span>About 5 minutes</span><button data-select="${i}">Practice this moment ↗</button></div></div></article>`).join('')}</div></section><section class="how" id="how"><div><strong><span class="num">1</span>Choose</strong><p>Find a moment you want to feel more prepared for.</p></div><div><strong><span class="num">2</span>Prepare</strong><p>Understand the situation and take a breath.</p></div><div><strong><span class="num">3</span>Practice</strong><p>Try a response. See illustrative feedback. Try again.</p></div><div><strong><span class="num">4</span>Reflect</strong><p>Take a few useful words into a real conversation.</p></div></section>`}
function prep(){return `${step(1)}<button class="back" id="back">← All situations</button><h1 style="font-size:41px;margin-top:0">First, make a little room.</h1><div class="prep-layout"><section class="panel scenario-intro"><div class="portrait" style="background:${c().color}">${childArt(selected)}</div><div class="eyebrow">${c().topic} · ${c().name}, ${c().age}</div><blockquote>“${c().open}”</blockquote><p class="muted">${c().context}</p></section><section class="panel"><div class="eyebrow">Before you respond</div><h2 style="margin-top:12px">Connection comes first.</h2><p class="muted">You don’t need every answer immediately. Start by showing that sharing with you was a good decision.</p><div class="feedback"><strong>What ${c().name} may need</strong>${c().need}</div><div class="tips"><div class="tip"><strong>Make space for…</strong><p>“Thank you for telling me.”<br>“You’re not to blame.”<br>“What would help right now?”</p></div><div class="tip avoid"><strong>Pause before…</strong><p>Blaming or dismissing.<br>Threatening punishment.<br>Taking over without listening.</p></div></div><div class="breath"><div><strong>A moment to settle</strong><br><span id="breath-label">Optional 30-second breathing pause</span></div><button id="breathe">Take a pause</button></div><button class="primary" id="begin">I’m ready to practice →</button><p class="sim-label">This is a fictional learning exercise. It does not predict a real child’s feelings or provide a clinical assessment.</p></section></div>`}
function options(){if(repairMode)return [{text:'I reacted out of fear. I’m sorry. You’re not in trouble for telling me. Can we start again?',kind:'repair'},{text:'I want to understand before we decide what to do. I’m here to listen.',kind:'good'},{text:'I’m the parent. Just do what I say.',kind:'harmful'}];if(count===0)return [{text:'What did you do now? Give me your phone.',kind:'harmful'},{text:'Thank you for telling me. You’re not in trouble for asking for help.',kind:'good'},{text:'Okay. Tell me more about what happened.',kind:'neutral'}];if(count===1)return [{text:'That sounds really upsetting. This isn’t your fault. What feels hardest right now?',kind:'good'},{text:'Just ignore it. It’s only the internet.',kind:'harmful'},{text:'When did that happen?',kind:'neutral'}];return [{text:'We can figure out the next steps together. I’ll explain before I ask anyone else for help.',kind:'good'},{text:'I’ll never tell anyone, no matter what happens.',kind:'promise'},{text:'You should have known better.',kind:'harmful'}]}
function zone(){return score<25?'Shut down':score<50?'Guarded':score<75?'Opening up':'Talking with you'}function practice(){let last=turns[turns.length-1];return `${step(2)}<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h1 style="font-size:33px;margin:0">A conversation with ${c().name}.</h1><button class="secondary" id="restart">↺ Restart</button></div><div class="practice"><aside class="panel"><div class="portrait" style="background:${c().color}">${childArt(selected)}</div><h3 style="margin:15px 0 4px">${c().name}, ${c().age}</h3><div class="eyebrow">${c().topic}</div><span class="zone">Conversation openness: ${zone()}</span><div class="meter"><span class="marker" style="left:calc(${score}% - 2px)"></span></div><div class="zones"><span>Shut down</span><span>Guarded</span><span>Opening up</span><span>Talking</span></div><div class="feeling"><strong>What ${c().name} might be feeling</strong><span aria-live="polite">${last?last.feeling:c().feeling}</span></div><p class="sim-label">Illustrative story state, not a psychological measure. Children’s reactions vary.</p></aside><section class="panel"><div class="eyebrow">Fictional practice · Turn ${turns.length+1}</div><div class="chatlog" id="chatlog" aria-live="polite">${messages.map(m=>`<div class="bubble ${m.who==='You'?'parent':''}"><span class="speaker">${m.who==='You'?'YOUR PRACTICE RESPONSE':m.who.toUpperCase()}</span>${esc(m.text)}</div>`).join('')}</div><div class="formlabel">${repairMode?'Try repairing the moment':'Choose a response to explore'}</div><div class="replies">${options().map((o,i)=>`<button class="reply" data-reply="${i}">${o.text}</button>`).join('')}</div><form id="custom-form"><label class="formlabel" for="custom">Or try your own words · Experimental feedback</label><textarea id="custom" maxlength="500" placeholder="What would you say?" required>${esc(customDraft)}</textarea><div class="actions"><button class="primary">Try my response →</button><button type="button" class="secondary" id="reflect">Finish & reflect</button></div></form><p class="sim-label">Use fictional replies only. Don’t enter names, real chats, or identifying details.</p></section><aside class="panel coach"><div class="coach-icon">✧</div><div class="eyebrow">Your practice coach</div><h3 style="margin-top:12px">A pause is progress.</h3><p>This is practice, not a test. Notice what your words make room for.</p>${last?`<div class="feedback"><strong>${last.title}</strong>${last.feedback}</div><p><strong>Another line to try</strong><br>“${last.alternative}”</p>${last.values.map(v=>`<span class="tag">${v}</span>`).join('')}`:'<div class="feedback"><strong>Begin with connection</strong>Thank them for telling you, listen, and avoid jumping straight to consequences.</div><span class="tag">Empathy</span><span class="tag">Respect</span>'}<button class="repair" id="repair">↺ Practice repairing a reaction</button><p class="sim-label">Suggested replies have authored feedback. Free text uses simple phrase checks and may miss context.</p></aside></div>`}
function respond(text,kind){let delta=0,title,feedback,alternative='Thank you for telling me. I’m here to listen.',values=[],feeling;const old=score;if(kind==='good'||kind==='repair'){delta=kind==='repair'?18:15;title=kind==='repair'?'You made room to begin again':'You made room for more';feedback=kind==='repair'?'Acknowledging your reaction and apologizing can reopen a conversation. Repair doesn’t erase the experience; it creates another opportunity to listen.':'This response offers support without blame. The next useful step is to listen and include the child in a plan.';values=kind==='repair'?['Self-reflection','Compassion']:['Empathy','Respect'];feeling=`${c().name} might feel more comfortable asking for support.`;count++}else if(kind==='harmful'){delta=-20;title='Pause and try a repair';feedback='Blame, dismissal, or an immediate threat of punishment may make sharing feel risky. You can acknowledge the reaction and start again.';alternative='I’m sorry I reacted that way. You did the right thing by telling me.';values=['Self-reflection'];feeling=`${c().name} might worry that sharing will lead to blame or losing control.`}else if(kind==='promise'){delta=-5;title='Support without an absolute promise';feedback='Reassurance matters, but promising secrecy in every situation may be impossible to keep. Explain that you will discuss any necessary help with them.';alternative='I’ll explain what I’m doing and why. You don’t have to face this alone.';values=['Integrity'];feeling=`${c().name} might feel reassured now, but unsure later if that promise cannot be kept.`}else if(kind==='unknown'){title='Let’s reflect rather than score';feedback='The phrase checker cannot confidently interpret this reply. Consider: does it acknowledge feelings, avoid blame, and leave space for the child to speak? No score change is applied.';values=[];feeling='This prototype cannot infer a reaction from these words.'}else{title='You asked for information';feedback='This can help clarify the situation. Pair questions with reassurance, and leave time for the child to answer.';alternative='Thank you for telling me. What would you like me to understand first?';values=['Respect'];feeling=`${c().name} might still be unsure how you will respond.`}score=Math.max(5,Math.min(95,score+delta));turns.push({text,kind,before:old,after:score,title,feedback,alternative,values,feeling});messages.push({who:'You',text});let line;if(kind==='harmful')line='I’m worried I shouldn’t have said anything. Can we slow down?';else if(kind==='unknown')line='[Pause the simulation and reflect on your response.]';else if(kind==='promise')line='What if we need someone else to help?';else if(kind==='neutral')line='I’m not sure how to explain it. I need you to listen.';else line=c().later[Math.min(count-1,2)];messages.push({who:c().name,text:line});repairMode=false;customDraft='';if(count>=3){go('reflect');return}render();$('#chatlog').scrollTop=$('#chatlog').scrollHeight}
function chart(){let scores=[50,...turns.map(t=>t.after)];let pts=scores.map((s,i)=>`${35+i*(430/Math.max(scores.length-1,1))},${130-s}`).join(' ');return `<svg class="chart" viewBox="0 0 500 160" role="img" aria-label="Illustrative conversation openness across ${turns.length} practice responses"><path d="M35 35H465M35 80H465M35 125H465" stroke="#dde4d5"/><polyline points="${pts}" fill="none" stroke="#48745b" stroke-width="3"/>${scores.map((s,i)=>`<circle cx="${35+i*(430/Math.max(scores.length-1,1))}" cy="${130-s}" r="4" fill="#48745b"/>`).join('')}<text x="35" y="149" font-size="9" fill="#73816f">Start</text><text x="430" y="149" font-size="9" fill="#73816f">Last turn</text></svg>`}
function reflect(){let vals=[...new Set(turns.flatMap(t=>t.values))];return `${step(3)}<div class="eyebrow">Practice, reflect, carry it with you</div><h1 style="font-size:43px;margin:12px 0">You don’t need perfect words.<br><em>You need room to listen.</em></h1><p class="muted">Here’s what you explored with ${c().name}. This summary evaluates the exercise, not your parenting.</p><div class="summary"><section class="panel"><h3>Your conversation journey</h3>${chart()}<p class="sim-label">This chart shows authored simulation changes. It does not measure real-world trust.</p>${turns.length?turns.map((t,i)=>`<div class="turn"><strong>${i+1}. ${esc(t.text)}</strong><p>${t.feedback}</p></div>`).join(''):'<p class="muted">No replies yet. You can return to practice whenever you’re ready.</p>'}</section><aside><section class="panel"><div class="eyebrow">Humanity 101 in practice</div><h3 style="margin-top:12px">Small choices. Human values.</h3>${vals.length?vals.map(v=>`<span class="tag">${v}</span>`).join(''):'<p class="muted">Try a response to explore empathy, respect, and self-reflection.</p>'}<p class="muted" style="margin-top:17px">Recognizing an unhelpful reaction is a chance to practice self-reflection, too.</p><h3>For your next conversation</h3>${['Thank them for telling you.','Listen before deciding what happens next.','Ask what support they need.','Explain any next steps and additional help.','Agree on a time to check in again.'].map(s=>`<label class="check"><input type="checkbox">${s}</label>`).join('')}<button class="primary" id="resources-button">Find relevant resources ↗</button></section><div style="display:flex;gap:10px;margin-top:15px"><button class="secondary" id="again">Practice again</button><button class="secondary" id="new">Try another situation</button></div></aside></div>`}
function resources(){return `<button class="back" id="back-home">← Back to practice</button><div class="eyebrow">For parents & caregivers</div><h1 style="font-size:43px">Start with listening.<br><em>Then find support.</em></h1><div class="summary"><section class="panel"><h3>A short conversation starter</h3><div class="script">“Thank you for telling me. You’re not in trouble for asking for help. I’m here to listen. Can you tell me what you need right now? We can work out the next steps together.”</div><p class="muted">Adapt these words to your child’s age and the situation. A real child may need time, silence, or a different trusted adult.</p><div class="notice">This app does not receive reports, contact professionals, or provide emergency assistance. The links open external services with their own privacy policies.</div></section><section><a class="resource" target="_blank" rel="noopener noreferrer" href="https://parents.thorn.org/"><strong>Thorn for Parents ↗</strong><span>Conversation guides about online safety.</span></a><a class="resource" target="_blank" rel="noopener noreferrer" href="https://www.missingkids.org/gethelpnow/cybertipline"><strong>NCMEC CyberTipline ↗</strong><span>Reporting suspected online child sexual exploitation.</span></a><a class="resource" target="_blank" rel="noopener noreferrer" href="https://www.stopbullying.gov/cyberbullying/what-is-it"><strong>StopBullying.gov ↗</strong><span>Information about cyberbullying and linked reporting resources.</span></a><p class="sim-label">Resources listed are U.S.-focused. A school counselor or trusted local professional may help identify appropriate support.</p></section></div>`}
function about(){return `<button class="back" id="back-home">← Back to situations</button><div class="eyebrow">Our approach</div><h1 style="font-size:43px">Prepare the adult.<br><em>Keep space for the child.</em></h1><div class="summary"><section class="panel"><h3>From advice to rehearsal</h3><p class="muted">The Talk Kit combines fictional scenarios, authored branching responses, conversation feedback, and repair practice. It is designed to help adults prepare for difficult online-safety conversations.</p><h3>Transparent simulation</h3><p class="muted">Suggested replies use predefined learning feedback. Optional typed replies use a small phrase-based checker, not AI. It may miss context, negation, sarcasm, or wording; uncertain replies receive no score change.</p><h3>What the meter means</h3><p class="muted">Conversation openness is an illustrative story device. It is not validated, diagnostic, or a prediction of a real child’s response. The app does not guarantee an outcome.</p></section><section class="panel"><h3>Privacy by design</h3><p class="muted">No accounts, file uploads, child profiles, or outgoing chat messages. Typed practice replies remain in this tab’s memory and clear on reload. Hosting providers may maintain standard access logs.</p><h3>Before real-world rollout</h3><p class="muted">Scenario content and feedback need review by qualified child-development and safeguarding professionals. Parent usability studies should evaluate the clarity and usefulness of the practice.</p><a href="https://parents.thorn.org/guides/getting-aligned-on-social-media-platforms/" target="_blank" rel="noopener noreferrer">Explore a source conversation guide ↗</a></section></div>`}
function render(){let html=stage==='home'?home():stage==='prep'?prep():stage==='practice'?practice():stage==='reflect'?reflect():stage==='about'?about():resources();$('#app').innerHTML=html;bind()}function bind(){document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.select);reset();go('prep')});if($('#start'))$('#start').onclick=()=>$('#situations').scrollIntoView({behavior:'smooth'});if($('#how-button'))$('#how-button').onclick=()=>$('#how').scrollIntoView({behavior:'smooth'});if($('#back'))$('#back').onclick=()=>go('home');if($('#back-home'))$('#back-home').onclick=()=>go('home');if($('#begin'))$('#begin').onclick=()=>{reset();go('practice')};if($('#breathe'))$('#breathe').onclick=()=>{if(breathTimer)return;let t=30;$('#breathe').textContent='Pausing…';$('#breath-label').textContent='Breathe comfortably. Take your time. 30s';breathTimer=setInterval(()=>{t--;if(!$('#breath-label')){clearInterval(breathTimer);breathTimer=null;return}$('#breath-label').textContent=`Breathe comfortably. Take your time. ${t}s`;if(t===0){clearInterval(breathTimer);breathTimer=null;$('#breath-label').textContent='Your pause is complete. Continue when you’re ready.';$('#breathe').textContent='Again'}},1000)};if($('#restart'))$('#restart').onclick=()=>{reset();render();toast('A fresh start. Take your time.')};document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{const o=options()[Number(b.dataset.reply)];respond(o.text,o.kind)});if($('#repair'))$('#repair').onclick=()=>{customDraft=$('#custom').value;repairMode=true;render();$('.reply').focus()};if($('#reflect'))$('#reflect').onclick=()=>go('reflect');if($('#custom-form'))$('#custom-form').onsubmit=e=>{e.preventDefault();const text=$('#custom').value.trim();if(!text)return;let kind='unknown';let low=text.toLowerCase();let good=/thank you for telling|thanks for telling|not your fault|not to blame|here to listen|not in trouble|sorry i reacted/.test(low);let bad=/you should have known better|what did you do now|give me your phone|only the internet|your own fault/.test(low);if(good&&!bad&&!/\b(not|never|don't|do not) thank/.test(low))kind='good';else if(bad&&!good)kind='harmful';respond(text,kind)};if($('#again'))$('#again').onclick=()=>{reset();go('practice')};if($('#new'))$('#new').onclick=()=>go('home');if($('#resources-button'))$('#resources-button').onclick=()=>go('resources')}
$('#home').onclick=()=>go('home');$('#how-nav').onclick=()=>{if(stage!=='home'){stage='home';render()}$('#how').scrollIntoView({behavior:'smooth'})};$('#about-nav').onclick=()=>go('about');$('#now-nav').onclick=()=>go('resources');render();
</script></body></html>
