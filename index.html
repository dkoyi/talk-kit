<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#234e43" />
    <meta
      name="description"
      content="A little practice for the conversations that matter. Fictional, guided conversation cards for parents and caregivers."
    />
    <title>The Talk Kit — A little practice. A closer connection.</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script type="module" src="assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to main content</a>
    <header>
      <button class="brand" id="home" aria-label="The Talk Kit home">
        <span class="brand-icon" aria-hidden="true"
          ><svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true">
            <path
              d="M10 17q10 18 20 0"
              stroke="currentColor"
              stroke-width="2.5"
              fill="none"
              stroke-linecap="round"
            /></svg></span
        >the talk kit<span class="brand-dot">.</span>
      </button>
      <nav aria-label="Main navigation">
        <button id="how-nav">How it works</button>
        <button class="aboutnav" id="about-nav">About</button>
        <button class="urgent" id="now-nav">
          Get help <span aria-hidden="true">↗</span>
        </button>
      </nav>
    </header>
    <button id="pause-session" class="pause-session" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10 10 5 20 4c0 10-5 15-14 15z"/><path d="M5 19l8-8"/></svg
      ><span><b>Take a pause</b></span>
    </button>
    <main id="app" tabindex="-1">
      <div class="loading">
        <span class="brand-icon">◡</span>
        <p>Loading…</p>
      </div>
    </main>
    <footer>
      <span><b>The Talk Kit</b></span
      ><span>Practice only · Not emergency help</span>
    </footer>
    <div class="toast" id="toast" role="status" hidden></div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-content"></div>
    </dialog>
    <noscript
      ><p class="notice">
        Turn on JavaScript to use the practice cards. For support, visit
        <a href="https://parents.thorn.org/">Thorn for Parents</a>.
      </p></noscript
    >
  </body>
</html>
