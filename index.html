/* v3 visual layer: paper flashcards, warm editorial typography, accessible controls */

:root{--bg:#faf6ee;--paper:#fffdf8;--ink:#203e37;--muted:#526961;--line:#d8e0d5;--green:#1c5042;--orange:#f1b78c;--mint:#e0ecdb;--purple:#e8dff1;--shadow:0 16px 40px rgba(24,60,48,.07)}
body{font-family:'DM Sans','Trebuchet MS',Arial,sans-serif;background:radial-gradient(circle at 5% 10%,#f4eadd 0,transparent 27%),radial-gradient(circle at 91% 45%,#f1eddf 0,transparent 34%),var(--bg)}
h1,h2,.quote,.script,.calm-cue,.popup strong{font-family:'Fraunces',Georgia,serif} h3{font-weight:800;letter-spacing:-.025em} .brand{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px}.brand-icon{border-radius:12px 12px 12px 3px;transform:rotate(-6deg)}
.hero-art,.card,.panel,.trustbar,.tip,.breath{box-shadow:var(--shadow)} .card{transition:transform .25s ease,box-shadow .25s ease} .card:hover{transform:translateY(-5px);box-shadow:0 22px 35px #203e371a}
.primary{box-shadow:0 6px 15px #1c504225;transition:transform .18s,background .18s}.primary:hover{transform:translateY(-2px)}
button:focus-visible,a:focus-visible{outline:3px solid #bf774a;outline-offset:3px}
/* Flashcard scene */
.practice-v3{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.65fr);gap:23px;align-items:start}.story-stack{min-width:0}.story-surface{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:23px;box-shadow:var(--shadow);overflow:hidden}
.story-surface:before{content:'';position:absolute;right:-45px;top:-90px;width:220px;height:220px;background:#eff1e6;border-radius:50%;pointer-events:none}
.story-header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.story-progress{display:flex;gap:6px}.story-progress i{display:block;width:32px;height:6px;border-radius:6px;background:#e0e4da}.story-progress i.active{background:var(--green)}
.scene-card{position:relative;display:grid;grid-template-columns:180px minmax(0,1fr);align-items:center;gap:16px;border-radius:20px;padding:20px;background:linear-gradient(135deg,var(--scene),#f2f2e7);min-height:215px;margin-bottom:16px}
.scene-card .portrait{height:180px;background:transparent!important}.scene-card .portrait svg{height:185px;width:200px;filter:drop-shadow(0 9px 8px #243e3717)}.scene-voice{align-self:center}.scene-voice .eyebrow{color:#416356}.scene-voice blockquote{font:400 clamp(18px,2.1vw,27px)/1.35 'Fraunces',Georgia,serif;letter-spacing:-.025em;margin:8px 0 13px}.scene-voice p{font-size:13px;color:#536a61;margin:0}
.story-listen{display:inline-flex;align-items:center;gap:8px;background:#fffdf8;color:var(--green);border:1px solid #c9d5c7;border-radius:30px;padding:8px 12px;font-size:13px;font-weight:800}.story-listen:disabled{opacity:.56;cursor:not-allowed}
.flash-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 12px}.flash-title h2{font-size:26px;margin:0}.key-tip{font-size:12px;color:var(--muted)}.flash-choices{display:grid;gap:11px}.flash-choice{text-align:left;width:100%;display:flex;align-items:center;gap:14px;background:#fffefb;border:1.5px solid #d9e0d7;border-radius:17px;padding:17px;min-height:70px;color:var(--ink);font-size:16px;line-height:1.45;transition:transform .17s,border-color .17s,box-shadow .17s}.flash-choice:hover:not(:disabled){border-color:#719783;transform:translateY(-2px);box-shadow:0 6px 12px #203e3712}.flash-choice[aria-pressed=true]{border:2px solid var(--green);background:#edf5ed;box-shadow:0 0 0 3px #bdd6c578}.flash-choice .choice-letter{flex:none;display:grid;place-items:center;border-radius:11px;width:34px;height:34px;background:#eceee6;font-weight:800;color:var(--green)}.flash-choice[aria-pressed=true] .choice-letter{background:var(--green);color:white}
.flash-actions{display:flex;justify-content:space-between;align-items:center;gap:13px;margin-top:17px;flex-wrap:wrap}.flash-actions .primary:disabled{opacity:.44;cursor:not-allowed;transform:none}.side-note{background:#fffdf8;border:1px solid var(--line);padding:25px;border-radius:23px;box-shadow:var(--shadow)}.side-note h3{font-size:21px}.side-note .portrait{height:130px;border-radius:18px;margin-bottom:18px}.story-feedback{background:#e7eee3;border-radius:16px;padding:16px;margin-top:18px;font-size:15px}.story-feedback strong{display:block;font-size:16px;margin-bottom:6px}.note-tags{margin:15px 0}.mood-note{font-size:13px;line-height:1.5;color:var(--muted)}
.story-quote{font-size:13px;line-height:1.65;color:#526b61;border-left:3px solid #a7b9a2;padding-left:12px;margin:15px 0}.micro-label{letter-spacing:.12em;font-weight:800;color:#5a7368;font-size:11px;text-transform:uppercase}
.flash-choice:disabled{cursor:not-allowed}.calm{isolation:isolate}.scene-card.is-new svg{animation:arrive .5s ease-out}@keyframes arrive{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:900px){.practice-v3{grid-template-columns:1fr}.side-note{order:2}.scene-card{grid-template-columns:145px 1fr}.scene-card .portrait svg{width:150px}}

const scenarios=[{name:'Maya',age:13,color:'#e5e9dc',topic:'Unwanted contact',headline:'Someone online is asking for photos.',context:'A person Maya met in a game server is asking for personal photos and wants her to keep their conversations secret.',background:'Some people online give kids attention or gifts, then ask for secrets and photos. Asking a child to keep secrets is a warning sign.',say:['“Thank you for telling me.”','“You’re not in trouble.”','“Asking you to keep secrets isn’t okay. That’s on them, not you.”'],avoid:['Asking “Why were you talking to them?”','Taking her phone as punishment.','Deleting the messages before you save them.'],open:'Can I tell you something? Someone in my game keeps asking for pictures. Please don’t get mad.',later:['They said it was our secret. I didn’t know what to do.','I was worried you’d take my phone away. Can you help me?','Can we figure out what to do together?'],replies:[[{text:'Why would you talk to strangers? Give me your phone.',kind:'harmful'},{text:'Thank you for telling me. You’re not in trouble, and I’m not mad.',kind:'good',values:['Kindness','Compassion']},{text:'Who is this person? What’s their username?',kind:'neutral',values:['Respect']}],[{text:'People who ask kids to keep secrets like that are the ones doing something wrong. This isn’t your fault.',kind:'good',values:['Forgiveness','Empathy']},{text:'Did you send them anything? You should have known better.',kind:'harmful'},{text:'How long has this been going on?',kind:'neutral',values:['Respect']}],[{text:'I’m not taking your phone for telling me. Let’s save the messages and report this together, and I’ll explain each step.',kind:'good',values:['Respect','Integrity']},{text:'I won’t tell anyone about this. I promise.',kind:'promise',values:['Integrity']},{text:'No more games for you until this is sorted out.',kind:'harmful'}]],need:'To hear that telling you was the right thing.',feeling:'“Am I going to be in trouble?”'},{name:'Jayden',age:11,color:'#eadfce',topic:'Cyberbullying',headline:'The group chat doesn’t feel safe anymore.',context:'Classmates are posting hurtful comments about Jayden in a group chat. He still wants to stay connected with his friends.',background:'Online bullying follows kids home. Many don’t tell adults because they fear losing their phone, or that you’ll make it worse.',say:['“That sounds really hurtful.”','“You don’t deserve this.”','“I won’t do anything without talking to you first.”'],avoid:['“Just leave the chat.”','Asking what he did to start it.','Calling the school or other parents before talking with him.'],open:'Everyone in the class chat is making fun of me. I don’t want you to make it a big thing.',later:['They keep sharing it. Even when I’m at home, it’s still there.','I don’t want to lose my friends too. Can you listen first?','Can we choose someone at school to talk to together?'],replies:[[{text:'I’m really glad you told me. That sounds awful, and you don’t deserve it.',kind:'good',values:['Kindness','Empathy']},{text:'Just leave the group chat. It’s only the internet.',kind:'harmful'},{text:'What exactly are they saying?',kind:'neutral',values:['Respect']}],[{text:'That sounds exhausting, like there’s no break from it. I’m listening.',kind:'good',values:['Empathy','Compassion']},{text:'Well, what did you do to make them act like that?',kind:'harmful'},{text:'Can you show me the messages?',kind:'neutral',values:['Respect']}],[{text:'I’ll talk through the next steps with you. Let’s decide who could help.',kind:'good',values:['Respect','Integrity']},{text:'I promise I’ll never say anything to the school.',kind:'promise',values:['Integrity']},{text:'I’m calling their parents tonight, whether you like it or not.',kind:'harmful',note:'Acting without him can make him stop telling you. Decide together.',alt:'I think an adult at school could help. Can we decide together who to talk to?'}]],need:'To feel heard, and to have a say in what happens next.',feeling:'“What if they make it worse?”'},{name:'Lucía',age:8,color:'#e9e2ed',topic:'Upsetting content',headline:'A video scared her. Now she can’t sleep.',context:'Autoplay led Lucía to a violent video. She is distressed and worried she did something wrong.',background:'Videos can play on their own and show young kids scary things they never searched for. Kids often blame themselves and may have trouble sleeping.',say:['“You didn’t do anything wrong.”','“It makes sense to feel scared.”','“I’m right here with you.”'],avoid:['“It’s not real, stop worrying.”','Taking the tablet away as punishment.','Lots of questions about the video at bedtime.'],open:'A scary video came on. I can’t stop thinking about it. Did I do something bad?',later:['I didn’t look for it. It just started playing.','I feel scared when I close my eyes. Can you stay with me?','Can we do something calming together?'],replies:[[{text:'Why were you watching videos without me? No more tablet.',kind:'harmful'},{text:'Come here. You didn’t do anything bad. Thank you for telling me.',kind:'good',values:['Kindness','Forgiveness']},{text:'What was the video about?',kind:'neutral',values:['Respect']}],[{text:'I believe you. Videos sometimes start on their own, and that’s not your fault. It makes sense that you feel scared.',kind:'good',values:['Empathy','Forgiveness']},{text:'It’s just a video. It’s not real, so stop being silly.',kind:'harmful'},{text:'Which app was it on?',kind:'neutral',values:['Respect']}],[{text:'I’ll stay right here with you. Let’s take some slow breaths together, and tomorrow we can change the settings so videos don’t play on their own.',kind:'good',values:['Compassion','Respect']},{text:'I promise you’ll never see anything scary again.',kind:'promise',values:['Integrity']},{text:'If you keep thinking about it, you’ll just make it worse.',kind:'harmful'}]],need:'Comfort, and to know she isn’t in trouble.',feeling:'“Did I do something bad?”'}];
let selectedChoice=-1, feedbackOpen=false, audioEnabled=false, activeAudio=null; let stage='home',prev='home',selected=0,score=50,turns=[],messages=[],count=0,repairMode=false,breathTimer,recorded=false,pending=false,run=0,opts=[],used=new Set(),shown=50,flash=0;const fast=matchMedia('(prefers-reduced-motion: reduce)').matches;const sleep=ms=>new Promise(r=>setTimeout(r,ms));const attempts={};const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function c(){return scenarios[selected]}function step(n){return `<div class="steps">${['Pick','Prepare','Practice','Reflect'].map((v,i)=>`<span class="${i===n?'active':''}">${i+1}. ${v}</span>`).join('')}</div>`}function focusTitle(){const h=$('main h1');if(h){h.tabIndex=-1;h.classList.add('focus-destination');h.focus()}}function go(s){stopAudio();if(breathTimer){clearInterval(breathTimer);breathTimer=null}if(s!==stage)prev=stage;if(s!=='practice'){run++;pending=false}if(s==='reflect'&&!recorded&&turns.length){(attempts[selected]=attempts[selected]||[]).push(score);recorded=true}stage=s;render();window.scrollTo(0,0);focusTitle()}function reset(){run++;pending=false;score=50;shown=50;flash=0;turns=[];messages=[{who:c().name,text:c().open}];count=0;repairMode=false;recorded=false;used=new Set();selectedChoice=-1;feedbackOpen=false;refreshOpts()}function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}

function home(){return `<section class="hero"><div><div class="eyebrow">For parents & caregivers</div><h1>When they tell you,<br><em>be ready to listen.</em></h1><p>Practice what to say when your child tells you something went wrong online.</p><div class="hero-actions"><button class="primary" id="start">Start practicing →</button></div></div><div class="hero-art"><svg viewBox="0 0 450 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="235" cy="90" r="87" fill="#c9d7bf"/><path d="M100 200v-48c0-52 100-52 100 0v48" fill="#567964"/><ellipse cx="151" cy="97" rx="32" ry="40" fill="#c99571"/><path d="M116 92V60c18-38 74-19 68 27-17-1-39-7-49-20-2 12-8 20-19 25" fill="#49443c"/><path d="M253 200v-27c0-42 100-42 100 0v27" fill="#c29e7e"/><ellipse cx="301" cy="129" rx="27" ry="33" fill="#d7a886"/><path d="M272 126v-31c22-27 61-11 57 26-24-5-34-19-34-19-4 11-11 19-23 24" fill="#5e4d3f"/><path d="M179 165q40 25 90 7" stroke="#c99571" stroke-width="16" fill="none" stroke-linecap="round"/><rect x="210" y="36" width="116" height="49" rx="15" fill="#fffaf0"/><path d="M221 83l-7 16 26-16" fill="#fffaf0"/><path d="M231 60h69m-69 10h45" stroke="#94a588" stroke-width="4" stroke-linecap="round"/><path d="M360 45v16m-8-8h16" stroke="#ae8c62" stroke-width="3"/></svg><div class="quote">“Thank you for telling me. I’m here with you.”<small>A good first thing to say.</small></div></div></section><div class="trustline"><span><b>✧</b> Expert review pending</span><span><b>◎</b> Free, no sign-up</span><span><b>↺</b> No accounts · Session-only</span></div><section id="situations"><div class="section-head"><h2>Pick a situation to practice</h2><p>About 3 minutes each.</p></div><div class="cards">${scenarios.map((s,i)=>`<article class="card" data-card="${i}"><div class="portrait" style="background:${s.color}"><span class="topic">${s.topic}</span>${childArt(i)}</div><div class="card-content"><h3>${s.name}, ${s.age}</h3><p>${s.headline}</p><blockquote>“${s.open}”</blockquote><div class="card-bottom"><button class="primary" data-select="${i}">Practice with ${s.name} →</button></div></div></article>`).join('')}</div></section><section class="how" id="how"><div><strong><span class="num">1</span>Pick</strong><p>Choose a situation.</p></div><div><strong><span class="num">2</span>Prepare</strong><p>Read a few tips.</p></div><div><strong><span class="num">3</span>Practice</strong><p>Try what you’d say.</p></div><div><strong><span class="num">4</span>Reflect</strong><p>Keep the words that worked.</p></div></section>`}
function prep(){return `${step(1)}<button class="back" id="back">← Back</button><h1 style="font-size:41px;margin-top:0">Get ready</h1><div class="prep-layout"><section class="panel scenario-intro"><div class="portrait" style="background:${c().color}">${childArt(selected)}</div><div class="eyebrow">${c().topic} · ${c().name}, ${c().age}</div><blockquote>“${c().open}”</blockquote><div class="feedback"><strong>What’s going on</strong>${c().background}</div></section><section class="panel"><div class="feedback" style="margin-top:0"><strong>What ${c().name} needs</strong>${c().need}</div><div class="tips"><div class="tip"><strong>Try saying</strong><p>${c().say.join('<br>')}</p></div><div class="tip avoid"><strong>Avoid</strong><p>${c().avoid.join('<br>')}</p></div></div><div class="breath"><div><strong>Feeling tense?</strong><br><span id="breath-label">Take a 30-second pause.</span></div><button id="breathe">Take a pause</button></div><button class="primary" id="begin">Start practice →</button></section></div>`}

 const heading=repairMode?'How could you repair this moment?':'What would you say next?';
 return `${step(2)}<div class="story-header"><h1 style="font-size:clamp(28px,4vw,39px);margin:0">A moment with ${c().name}</h1><button class="secondary" id="restart">↺ Restart</button></div><div class="practice-v3"><section class="story-stack"><div class="story-surface"><div class="story-header"><span class="micro-label">${repairMode?'Repair the moment':`Moment ${Math.min(count+1,3)} of 3`}</span><div class="story-progress">${[0,1,2].map(i=>`<i class="${count>i?'active':''}"></i>`).join('')}</div></div><div class="scene-card is-new" style="--scene:${c().color}"><div class="portrait">${childArt(selected,mood)}</div><div class="scene-voice"><div class="eyebrow">${c().name}, ${c().age} · Fictional dialogue</div><blockquote>“${esc(spoken)}”</blockquote><button type="button" class="story-listen" id="listen" ${audioPath?'':'disabled'}>♫ ${audioPath?'Play dialogue':'Audio coming soon'}</button></div></div><div class="flash-title"><h2>${done?'You’ve reached the end of this practice.':heading}</h2><span class="key-tip">Choose a card, then continue</span></div>${done?`<div class="story-feedback">There is no perfect score. Review the choices you explored and how you might respond in real life.</div><div class="flash-actions"><button class="primary" id="see-results">See reflection →</button></div>`:`<div class="flash-choices" role="group" aria-label="Parent responses">${choices.map((o,i)=>`<button class="flash-choice" type="button" data-choice="${i}" aria-pressed="${i===selectedChoice}" ${pending?'disabled':''}><span class="choice-letter">${String.fromCharCode(65+i)}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div class="flash-actions"><button class="secondary" id="reflect" type="button">Finish early</button><button class="primary" id="confirm-choice" ${selectedChoice<0||pending?'disabled':''}>Try this response →</button></div>`}</div></section><aside class="side-note"><div class="micro-label">Your practice companion</div><h3 style="margin:10px 0 15px">One conversation. Many ways forward.</h3><div class="portrait" style="background:${c().color}">${childArt(selected,mood)}</div><p class="mood-note"><strong>Possible story reaction:</strong> ${last?esc(last.feeling):esc(c().feeling)}</p><p class="story-quote">This fictional expression illustrates one possible response. It does not measure a real child's emotions or trust.</p>${last?`<div class="story-feedback" aria-live="polite"><strong>${esc(last.title)}</strong>${esc(last.feedback)}<p style="margin:9px 0 0"><strong>Another line:</strong> “${esc(last.alternative)}”</p></div>`:`<div class="story-feedback"><strong>A place to practice, not a test</strong>Listen, avoid blame, and think about appropriate protective next steps.</div>`}<div class="note-tags"><span class="tag">Connection</span><span class="tag">Next steps</span><span class="tag">Repair</span></div>${!done&&!repairMode&&last?.kind==='harmful'?`<button class="repair" id="repair-now">↺ Practice repairing</button>`:''}<p class="sim-label">Suggested responses are prewritten educational examples. Professional review is pending.</p></aside></div>`;
}
function audioFor(si,scene,repair){const key=['maya','jayden','lucia'][si];const candidate=repair?`assets/audio/${key}/repair.mp3`:`assets/audio/${key}/scene-${Math.min(scene+1,3)}.mp3`;return availableAudio.has(candidate)?candidate:null}
const availableAudio=new Set(); // Add only existing recorded asset paths here, e.g. 'assets/audio/maya/scene-1.mp3'
function stopAudio(){if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}}
function playAudio(path){stopAudio();if(!path)return;activeAudio=new Audio(path);activeAudio.play().catch(()=>toast('Audio is unavailable. You can still read the dialogue.'))}
const BASE={good:{d:15,title:'That helped',fb:'No blame, just support. Next, listen and plan together.',alt:'Thank you for telling me. I’m here to listen.'},repair:{d:18,title:'Nice repair',fb:'Saying sorry opens the conversation again.',alt:'Thank you for giving me another chance to listen.'},harmful:{d:-20,title:'That may shut them down',fb:'Blame or punishment may make sharing feel riskier. Try saying sorry and starting again.',alt:'I’m sorry I reacted that way. You did the right thing by telling me.'},promise:{d:-5,title:'Careful with promises',fb:'Only promise what you can keep. Say what you’ll do and why.',alt:'I’ll explain what I’m doing and why. You don’t have to face this alone.'},neutral:{d:0,title:'A fair question',fb:'Add some comfort, and give them time to answer.',alt:'Thank you for telling me. What would you like me to understand first?'}};
function feelingFor(kind){return {good:'“Okay… maybe I can tell them more.”',repair:'“They said sorry. Maybe I can try again.”',harmful:'“I shouldn’t have said anything.”',promise:'“What if they can’t keep that promise?”',neutral:'“I’m not sure how they’ll react.”'}[kind]}
async function respond(o){if(pending)return;const my=++run,b=BASE[o.kind],old=score,delta=o.delta??b.d,next=Math.max(5,Math.min(95,score+delta));if(repairMode){repairMode=false;}else{count=Math.min(3,count+1);}used.add(o.text);turns.push({text:o.text,kind:o.kind,before:old,after:next,title:o.title||b.title,feedback:o.note||b.fb,alternative:o.alt||b.alt,values:o.values||[],feeling:feelingFor(o.kind)});messages.push({who:'You',text:o.text});
let lines=CHILD[o.text]||[c().later[Math.min(Math.max(count-1,0),2)]];if(o.kind==='harmful'&&next<30)lines=['…','I’m not sure I want to keep talking right now.'];
// The child pauses longer before answering when trust is low.
pending=true;render();scrollChat();await sleep(fast?300:900+(old<50?700:0)+(o.kind==='harmful'?500:0));
for(let k=0;k<lines.length;k++){if(my!==run||stage!=='practice')return;if(k){pending=true;render();scrollChat();await sleep(fast?300:Math.min(1800,500+lines[k].length*22));if(my!==run||stage!=='practice')return}messages.push({who:c().name,text:lines[k]});if(k===0){score=next;flash=delta}pending=k<lines.length-1;if(!pending){repairMode=o.kind==='harmful';selectedChoice=-1;refreshOpts()}render();scrollChat();flash=0}
if(o.kind==='harmful')popup(`That may shut ${c().name} down`,`${o.note||'Blame or punishment may make sharing feel riskier.'} Try saying sorry.`);else if(o.kind==='promise')popup('Careful with promises','Only promise what you can keep.')}
function scrollChat(){const l=$('#chatlog');if(l)l.scrollTop=l.scrollHeight}
// Short popup after a hurtful answer or a promise that can't be kept; hides after about 3 seconds.
let popupTimer;function popup(title,text){const el=$('#popup');$('#popup-title').textContent=title;$('#popup-text').textContent=text;el.hidden=false;clearTimeout(popupTimer);popupTimer=setTimeout(()=>el.hidden=true,3000)}
function chart(){let scores=[50,...turns.map(t=>t.after)];let pts=scores.map((s,i)=>`${35+i*(430/Math.max(scores.length-1,1))},${130-s}`).join(' ');return `<svg class="chart" viewBox="0 0 500 160" role="img" aria-label="Illustrative story openness across ${turns.length} practice responses"><path d="M35 35H465M35 80H465M35 125H465" stroke="#dde4d5"/><polyline points="${pts}" fill="none" stroke="#48745b" stroke-width="3"/>${scores.map((s,i)=>`<circle cx="${35+i*(430/Math.max(scores.length-1,1))}" cy="${130-s}" r="4" fill="#48745b"/>`).join('')}<text x="35" y="149" font-size="13" fill="#73816f">Start</text><text x="400" y="149" font-size="13" fill="#73816f">Last turn</text></svg>`}
function compare(){const a=attempts[selected]||[];if(a.length<2)return '';const d=a[a.length-1]-a[0];return `<div class="feedback"><strong>${d>0?'Different from your first try':'Compared with your first try'}</strong>First try: ${a[0]} · This try: ${a[a.length-1]} (out of 100)</div>`}
function reflect(){let vals=new Set(turns.flatMap(t=>t.values));return `${step(3)}<h1 style="font-size:43px;margin:12px 0">Well done.<br><em>You don’t need perfect words.</em></h1><div class="summary"><section class="panel"><h3>Your story path</h3>${chart()}${compare()}${turns.length?turns.map((t,i)=>`<div class="turn"><strong>${i+1}. ${esc(t.text)}</strong><p>${esc(t.feedback)}</p>${t.values.map(v=>`<span class="tag">${v}</span>`).join('')}</div>`).join(''):'<p class="muted">No replies yet. Go back and try one when you’re ready.</p>'}</section><aside><section class="panel"><h3>Values you showed</h3>${PRINCIPLES.map(p=>`<span class="tag ${vals.has(p)?'':'off'}">${vals.has(p)?'✓ ':''}${p}</span>`).join('')}<p class="muted" style="margin-top:12px">${vals.size} of 7</p><h3>Remember in real life</h3>${['Thank them for telling you.','Listen first.','Ask what they need.','Explain before you act.','Check in again later.'].map(s=>`<label class="check"><input type="checkbox">${s}</label>`).join('')}<button class="primary" id="plan-button">See next steps →</button></section><div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap"><button class="secondary" id="again">Try again</button><button class="secondary" id="new">Another situation</button></div></aside></div>`}
// Calm next steps for each situation, shown after practice.
const PLANS=[{steps:['<strong>Stay calm and thank her.</strong> She did the right thing by telling you.','<strong>Save proof.</strong> Record ordinary text messages, the username, and dates if safe. Do not download or share sexual images involving minors.','<strong>Never</strong> save or send a sexual image of a child. Just describe it when you report.','<strong>Report it</strong> to the NCMEC CyberTipline.','<strong>Block and report</strong> the account in the game.','<strong>Check in</strong> with her again in a few days.'],links:[['Report it: NCMEC CyberTipline','Or call 1-800-843-5678, any time.','https://report.cybertip.org/'],['Remove photos: Take It Down','If photos were shared. Free and private.','https://takeitdown.ncmec.org/'],['Talking tips: Thorn for Parents','Guides for talking about online safety.','https://parents.thorn.org/']]},{steps:['<strong>Listen first.</strong> Tell him you won’t act without talking to him.','<strong>Save proof.</strong> Screenshot the messages with names and dates.','<strong>Choose together</strong> a trusted adult at school to tell, like a teacher or counselor.','<strong>Report the posts</strong> in the app. Let him decide whether to mute or leave the chat.','<strong>Check in</strong> with him again in a few days.'],links:[['Bullying help: StopBullying.gov','What to do about online bullying.','https://www.stopbullying.gov/cyberbullying/what-is-it'],['Call or text 988','If he talks about hurting himself. Any time.','https://988lifeline.org/']]},{steps:['<strong>Comfort her.</strong> Keep bedtime calm and stay close.','<strong>Turn off autoplay</strong> and set up a kids’ profile or parental controls in the app.','<strong>Use screens together</strong> in a shared room for a while.','<strong>Talk to her pediatrician</strong> if the fear lasts more than a couple of weeks or affects sleep or school.','<strong>Check in</strong> with her again in a few days.'],links:[['Talking tips: Thorn for Parents','Guides for talking about online safety.','https://parents.thorn.org/']]}];
function plan(){const pl=PLANS[selected];return `<button class="back" id="back-reflect">← Back</button><h1 style="font-size:43px">Next steps<br><em>for a situation like ${c().name}’s</em></h1><div class="summary"><section class="panel"><h3>What to do</h3><ol class="now-steps">${pl.steps.map(x=>`<li>${x}</li>`).join('')}</ol></section><section><h3>Helpful links</h3>${pl.links.map(([t,d,h])=>`<a class="resource" target="_blank" rel="noopener noreferrer" href="${h}"><strong>${t} ↗</strong><span>${d}</span></a>`).join('')}<button class="secondary" id="now-link" style="width:100%;margin-top:12px">Is it happening right now? →</button><p class="sim-label">U.S. contacts.</p></section></div>`}
function resources(){return `<button class="back" id="back-prev">← Back</button><h1 style="font-size:43px">Stay calm.<br><em>You can handle this.</em></h1><div class="summary"><section class="panel"><h3>Right now</h3><ol class="now-steps"><li>Take a slow breath.</li><li>Say:</li></ol><div class="script">“Thank you for telling me. You’re not in trouble. We’ll figure this out together.”</div><ol class="now-steps" start="3"><li>Listen. Let them finish.</li><li>Tell them what you’ll do before you do it.</li></ol><h3 style="margin-top:26px">Save proof</h3><ul class="evidence"><li>Preserve ordinary text evidence where appropriate; do not download or forward sexual images of minors.</li><li>Preserve ordinary messages, usernames, and dates where appropriate. Never download or share sexual images of minors.</li><li><strong>Never</strong> save or send a sexual image of a child. Just describe it when you report.</li><li>Don’t reply to the person.</li><li>Then block and report them in the app.</li></ul><div class="notice">We don’t receive reports. These links open other websites.</div></section><section><h3>Get help</h3><a class="resource alert" href="tel:911"><strong>Danger right now? Call 911</strong><span>If your child is in danger or someone wants to meet them.</span></a><a class="resource" target="_blank" rel="noopener noreferrer" href="https://report.cybertip.org/"><strong>Report it: NCMEC CyberTipline ↗</strong><span>If someone asked your child for sexual photos or chats. Or call 1-800-843-5678, any time.</span></a><a class="resource" target="_blank" rel="noopener noreferrer" href="https://takeitdown.ncmec.org/"><strong>Remove photos: Take It Down ↗</strong><span>Get nude photos of your child taken down. Free and private.</span></a><a class="resource" target="_blank" rel="noopener noreferrer" href="https://988lifeline.org/"><strong>Call or text 988 ↗</strong><span>If your child talks about hurting themselves. Any time.</span></a><a class="resource" target="_blank" rel="noopener noreferrer" href="https://www.stopbullying.gov/cyberbullying/what-is-it"><strong>Bullying help: StopBullying.gov ↗</strong><span>What to do about online bullying.</span></a><a class="resource" target="_blank" rel="noopener noreferrer" href="https://parents.thorn.org/"><strong>Talking tips: Thorn for Parents ↗</strong><span>Guides for talking about online safety.</span></a><p class="sim-label">U.S. contacts.</p></section></div>`}
function about(){return `<button class="back" id="back-home">← Back</button><h1 style="font-size:43px">About The Talk Kit</h1><div class="summary"><section class="panel"><h3>What it is</h3><p class="muted">A free place to practice hard talks about online safety, and to know what to do next.</p><h3>How the tips work</h3><p class="muted">Each answer you can pick comes with a tip written in advance and awaiting qualified professional review.</p><h3>The trust meter</h3><p class="muted">It visualizes a possible story direction. It’s a guide, not a test. Real children react differently.</p></section><section class="panel"><h3>Who checked it</h3><p class="muted">${REVIEWER?`Reviewed by ${esc(REVIEWER)} for the indicated version.`:"Professional review has not yet been completed. These fictional exercises are educational drafts, not clinical guidance."} Based on public resources from Thorn and NCMEC; scenario wording has not been endorsed by these organizations.</p><h3>Your privacy</h3><p class="muted">No sign-up. Responses stay in this browser tab memory and reset when the page reloads. Your hosting provider may keep ordinary access logs.</p><a href="https://parents.thorn.org/guides/getting-aligned-on-social-media-platforms/" target="_blank" rel="noopener noreferrer">Read Thorn’s guide ↗</a></section></div>`}
function render(){let html=stage==='home'?home():stage==='prep'?prep():stage==='practice'?practice():stage==='reflect'?reflect():stage==='about'?about():stage==='plan'?plan():resources();$('#app').innerHTML=html;bind()}function bind(){document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.card);reset();go('prep')});if($('#start'))$('#start').onclick=()=>$('#situations').scrollIntoView({behavior:'smooth'});if($('#how-button'))$('#how-button').onclick=()=>$('#how').scrollIntoView({behavior:'smooth'});if($('#back'))$('#back').onclick=()=>go('home');if($('#back-home'))$('#back-home').onclick=()=>go('home');if($('#back-prev'))$('#back-prev').onclick=()=>go(prev==='resources'?'home':prev);if($('#begin'))$('#begin').onclick=()=>{reset();go('practice')};if($('#breathe'))$('#breathe').onclick=openCalm;if($('#restart'))$('#restart').onclick=()=>{reset();render();toast('Fresh start.')};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selectedChoice=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach((el,i)=>el.setAttribute('aria-pressed',String(i===selectedChoice)));$('#confirm-choice').disabled=false});if($('#confirm-choice'))$('#confirm-choice').onclick=()=>{if(selectedChoice<0)return;const choice=options()[selectedChoice];selectedChoice=-1;respond(choice)};if($('#listen'))$('#listen').onclick=()=>playAudio(audioFor(selected,count,repairMode));if($('#repair-now'))$('#repair-now').onclick=()=>{repairMode=true;selectedChoice=-1;refreshOpts();render()};if($('#reflect'))$('#reflect').onclick=()=>go('reflect');if($('#see-results'))$('#see-results').onclick=()=>go('reflect');const mk=$('.marker');if(mk&&shown!==score){mk.offsetWidth;mk.style.left=`calc(${score}% - 2px)`;shown=score}if($('#again'))$('#again').onclick=()=>{reset();go('practice')};if($('#new'))$('#new').onclick=()=>go('home');if($('#plan-button'))$('#plan-button').onclick=()=>go('plan');if($('#back-reflect'))$('#back-reflect').onclick=()=>go('reflect');if($('#now-link'))$('#now-link').onclick=()=>go('resources')}
$('#home').onclick=()=>go('home');$('#how-nav').onclick=()=>{if(stage!=='home'){stage='home';render()}$('#how').scrollIntoView({behavior:'smooth'})};$('#about-nav').onclick=()=>go('about');$('#now-nav').onclick=()=>go('resources');$('#calm-close').onclick=closeCalm;document.addEventListener('keydown',e=>{if($('#calm').hidden)return;if(e.key==='Escape')closeCalm();else if(e.key==='Tab'){e.preventDefault();$('#calm-close').focus()}});render();
</script></body></html>
